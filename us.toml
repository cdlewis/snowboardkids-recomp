# Config file for the Snowboard Kids (USA) Recompilation.
[input]
entrypoint = 0x80000400
# Paths are relative to the location of this config file.
symbols_file_path = "snowboardkids-recomp-syms/dump.toml"
rom_file_path = "snowboardkids.z64"
output_func_path = "RecompiledFuncs"

[patches]
stubs = [
]

# Microcode blobs. These are data, but the symbol table types them as functions,
# so the recompiler would otherwise try to translate them as MIPS.
# (rspbootTextStart is already in N64Recomp's built-in ignore list, as are
# osInvalDCache/osInvalICache, so they must not be repeated here.)
ignored = [
    "aspMainTextStart",
    "gspF3DLX_fifoTextStart",
]

# The decompilation names the game's entry function "main", which C reserves.
# N64Recomp appends "_recomp" to anything listed here.
renamed = [
    "main",
]
